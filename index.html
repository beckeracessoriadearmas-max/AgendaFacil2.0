<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda Fácil</title>

<link rel="stylesheet" href="css/estilo.css">
<link rel="manifest" href="manifest.json">

<!-- ✅ FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

</head>

<body>

<div class="topo">
📅 Agenda Fácil
<button onclick="logout()">Sair</button>
</div>

<div class="container">

<div class="card">
<h3>📊 Dashboard</h3>
<p>Total: <strong id="totalMes">R$ 0,00</strong></p>
<p>Diárias: <strong id="totalDiarias">0</strong></p>
</div>

<div class="card">
<h3>📆 Calendário</h3>
<div id="calendario" class="calendario"></div>
</div>

<div class="card">
<button class="botao" onclick="location.href='pages/nova-diaria.html'">
➕ Nova Diária
</button>
</div>

<div class="card">
<button class="botao" onclick="location.href='pages/financeiro.html'">
💰 Financeiro
</button>
</div>

<div class="card">
<button class="botao" onclick="location.href='pages/configuracoes.html'">
⚙️ Configurações
</button>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-conteudo">
<span class="fechar" onclick="fecharModal()">×</span>
<h3 id="tituloModal"></h3>
<div id="listaServicos"></div>
</div>
</div>

<!-- ✅ FullCalendar JS (ANTES do seu script) -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<!-- ✅ SCRIPT DO CALENDÁRIO -->
<script>

document.addEventListener('DOMContentLoaded', function () {

    const calendarioEl = document.getElementById('calendario');

    const calendario = new FullCalendar.Calendar(calendarioEl, {
        initialView: 'dayGridMonth',
        locale: 'pt-br',

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },

        buttonText:{
            today:'Hoje',
            month:'Mês',
            week:'Semana'
        },

        dateClick: function(info){
            alert("Dia selecionado: " + info.dateStr);
        }

    });

    calendario.render();
});

</script>

</body>
</html>

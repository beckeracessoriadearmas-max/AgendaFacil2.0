<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../css/estilo.css">
</head>

<body onload="verificarLogin()">

<div class="container">

<div class="card">

<input id="cliente" placeholder="Cliente"><br><br>
<input id="data" type="date"><br><br>
<input id="horario" type="time"><br><br>
<input id="valor" placeholder="Valor"><br><br>

<button class="botao" onclick="salvar()">Salvar</button>

</div>

</div>

<script src="../js/auth.js"></script>

<script>
function salvar(){

let cliente=document.getElementById("cliente").value;
let data=document.getElementById("data").value;
let horario=document.getElementById("horario").value;
let valor=document.getElementById("valor").value;

// validação básica
if(!cliente || !data){
    alert("Preencha Cliente e Data");
    return;
}

let diarias=JSON.parse(localStorage.getItem("diarias"))||[];

diarias.push({
    cliente:cliente,
    data:data,
    horario:horario,
    valor:Number(valor)||0
});

localStorage.setItem("diarias",JSON.stringify(diarias));

alert("Diária salva com sucesso!");

window.location="../index.html";

}
</script>

</body>
</html>
